<!-- @dsCard group="Components" name="Status chips" -->
<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SuperTrades · Status chips</title>
<style>
  :root{
    --bg:#F2F4F4; --surface:#FFFFFF; --surface2:#E9EDED; --line:#D5DCDC;
    --ink:#17211F; --ink2:#4A5654; --ink3:#7A8684;
    --accent:#2E7E92; --accent-soft:#2E7E9222;
    --good:#22795A; --warn:#8A6215; --crit:#A33D2F;
    --good-bg:#22795A1A; --warn-bg:#8A62151A; --crit-bg:#A33D2F1A;
  }
  @media (prefers-color-scheme: dark){ :root{
    --bg:#0C1516; --surface:#121D1F; --surface2:#0F181A; --line:#233335;
    --ink:#E6ECEA; --ink2:#9FAEAC; --ink3:#6E7B79;
    --accent:#6FB4C8; --accent-soft:#6FB4C826;
    --good:#4CBF8C; --warn:#D9A83F; --crit:#E07B62;
    --good-bg:#4CBF8C1F; --warn-bg:#D9A83F1F; --crit-bg:#E07B621F;
  }}
  :root[data-theme="dark"]{
    --bg:#0C1516; --surface:#121D1F; --surface2:#0F181A; --line:#233335;
    --ink:#E6ECEA; --ink2:#9FAEAC; --ink3:#6E7B79;
    --accent:#6FB4C8; --accent-soft:#6FB4C826;
    --good:#4CBF8C; --warn:#D9A83F; --crit:#E07B62;
    --good-bg:#4CBF8C1F; --warn-bg:#D9A83F1F; --crit-bg:#E07B621F;
  }
  :root[data-theme="light"]{
    --bg:#F2F4F4; --surface:#FFFFFF; --surface2:#E9EDED; --line:#D5DCDC;
    --ink:#17211F; --ink2:#4A5654; --ink3:#7A8684;
    --accent:#2E7E92; --accent-soft:#2E7E9222;
    --good:#22795A; --warn:#8A6215; --crit:#A33D2F;
    --good-bg:#22795A1A; --warn-bg:#8A62151A; --crit-bg:#A33D2F1A;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);margin:0;padding:18px;
    font:14px/1.55 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
  .eyebrow{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink3);margin:0 0 12px}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .chip{display:inline-block;border-radius:3px;padding:2px 8px;font-size:10.5px;font-weight:600;letter-spacing:.06em;white-space:nowrap;font-family:ui-monospace,Menlo,monospace}
  .chip.good{background:var(--good-bg);color:var(--good)}
  .chip.warn{background:var(--warn-bg);color:var(--warn)}
  .chip.crit{background:var(--crit-bg);color:var(--crit)}
  .chip.mut{background:var(--surface2);color:var(--ink2)}
  .flat{display:inline-flex;align-items:center;background:var(--accent-soft);color:var(--accent);
    border:1px solid var(--accent);border-radius:3px;padding:2px 10px;font-size:11px;letter-spacing:.12em;font-weight:600;font-family:ui-monospace,Menlo,monospace}
</style></head><body>

  <p class="eyebrow">Chips — state reads at a glance</p>
  <div class="row"><span class="chip good">#1 long-watch</span><span class="chip good">FILLED +64%</span>
    <span class="chip warn">short-watch</span><span class="chip warn">GATE: STANDBY</span>
    <span class="chip crit">demoted</span><span class="chip crit">HALT −$60</span>
    <span class="chip mut">anchor</span><span class="chip mut">0DTE</span><span class="chip mut">monitor</span></div>
  <div class="row"><span class="flat">LIVE · WATCHING</span><span class="flat">FLAT · EOD</span></div>
</body></html>
