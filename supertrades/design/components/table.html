<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SuperTrades · Watchlist table</title>
<style>
  :root{
    --bg:#F2F4F4; --surface:#FFFFFF; --surface2:#E9EDED; --line:#D5DCDC;
    --ink:#17211F; --ink2:#4A5654; --ink3:#7A8684;
    --accent:#2E7E92; --accent-soft:#2E7E9222;
    --good:#22795A; --warn:#8A6215; --crit:#A33D2F;
    --good-bg:#22795A1A; --warn-bg:#8A62151A; --crit-bg:#A33D2F1A;
  }
  @media (prefers-color-scheme: dark){ :root{
    --bg:#0C1516; --surface:#121D1F; --surface2:#0F181A; --line:#233335;
    --ink:#E6ECEA; --ink2:#9FAEAC; --ink3:#6E7B79;
    --accent:#6FB4C8; --accent-soft:#6FB4C826;
    --good:#4CBF8C; --warn:#D9A83F; --crit:#E07B62;
    --good-bg:#4CBF8C1F; --warn-bg:#D9A83F1F; --crit-bg:#E07B621F;
  }}
  :root[data-theme="dark"]{
    --bg:#0C1516; --surface:#121D1F; --surface2:#0F181A; --line:#233335;
    --ink:#E6ECEA; --ink2:#9FAEAC; --ink3:#6E7B79;
    --accent:#6FB4C8; --accent-soft:#6FB4C826;
    --good:#4CBF8C; --warn:#D9A83F; --crit:#E07B62;
    --good-bg:#4CBF8C1F; --warn-bg:#D9A83F1F; --crit-bg:#E07B621F;
  }
  :root[data-theme="light"]{
    --bg:#F2F4F4; --surface:#FFFFFF; --surface2:#E9EDED; --line:#D5DCDC;
    --ink:#17211F; --ink2:#4A5654; --ink3:#7A8684;
    --accent:#2E7E92; --accent-soft:#2E7E9222;
    --good:#22795A; --warn:#8A6215; --crit:#A33D2F;
    --good-bg:#22795A1A; --warn-bg:#8A62151A; --crit-bg:#A33D2F1A;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);margin:0;padding:18px;
    font:14px/1.55 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
  .eyebrow{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink3);margin:0 0 12px}
  .scroll{overflow-x:auto;max-width:720px}
  table{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
  th{color:var(--ink3);font-weight:600;font-size:11px;letter-spacing:.09em;text-transform:uppercase;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 10px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:none}
  .num{text-align:right;font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
  .chip{display:inline-block;border-radius:3px;padding:1px 7px;font-size:10.5px;font-weight:600;font-family:ui-monospace,Menlo,monospace}
  .chip.good{background:var(--good-bg);color:var(--good)}
  .chip.warn{background:var(--warn-bg);color:var(--warn)}
  .chip.crit{background:var(--crit-bg);color:var(--crit)}
  .chip.mut{background:var(--surface2);color:var(--ink2)}
</style></head><body>

  <p class="eyebrow">Live watchlist — dynamic re-rank</p>
  <div class="scroll"><table>
    <thead><tr><th>Name</th><th class="num">Day %</th><th>Structure / GEX</th><th>Status</th></tr></thead>
    <tbody>
      <tr><td class="mono">NVDA</td><td class="num" style="color:var(--good)">+4.6%</td><td>above rising VWAP ~220</td><td><span class="chip good">#1 long-watch</span></td></tr>
      <tr><td class="mono">QQQ</td><td class="num" style="color:var(--crit)">−0.5%</td><td>below flip 724.4 · put wall 720</td><td><span class="chip warn">short-watch</span></td></tr>
      <tr><td class="mono">SPY</td><td class="num">≈0%</td><td>pinned 770–773 · +GEX</td><td><span class="chip mut">anchor</span></td></tr>
      <tr><td class="mono">META</td><td class="num" style="color:var(--crit)">−0.9%</td><td>lost VWAP · rolled over</td><td><span class="chip crit">demoted</span></td></tr>
    </tbody>
  </table></div>
</body></html>
